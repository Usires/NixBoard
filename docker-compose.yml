version: "3.8"

services:
  # Frontend (Vue.js static)
  frontend:
    image: nginx:alpine
    container_name: kanban-frontend
    restart: always
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src:/usr/share/nginx/html/src:ro
    ports:
      - "3050:80"
    networks:
      - kanban-net

  # Backend (Express + SQLite)
  backend:
    image: node:20
    container_name: kanban-backend
    restart: always
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3036:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    command: sh -c "npm install && mkdir -p data && node index.js"
    networks:
      - kanban-net
    depends_on:
      - frontend

networks:
  kanban-net:
    driver: bridge
